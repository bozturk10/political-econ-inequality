th="2"></line><text x="161" y="348.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#586773" text-anchor="end">80</text><text x="175.0" y="884" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#586773" text-anchor="middle">2000</text><text x="631.6666666666666" y="884" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#586773" text-anchor="middle">2005</text><text x="1088.3333333333333" y="884" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#586773" text-anchor="middle">2010</text><text x="1545.0" y="884" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#586773" text-anchor="middle">2015</text><line x1="175" y1="845" x2="1545" y2="845" stroke="#AAB6BC" stroke-width="2"></line><path d="M175.0,582.4 L631.7,501.6 L1088.3,461.2 L1545.0,441.0" fill="none" stroke="#16838D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="175.0" cy="582.4" r="7" fill="#16838D" stroke="white" stroke-width="2"></circle><circle cx="631.6666666666666" cy="501.59999999999997" r="7" fill="#16838D" stroke="white" stroke-width="2"></circle><circle cx="1088.3333333333333" cy="461.2" r="7" fill="#16838D" stroke="white" stroke-width="2"></circle><circle cx="1545.0" cy="441.0" r="7" fill="#16838D" stroke="white" stroke-width="2"></circle><text x="1558.0" y="449.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#16838D" text-anchor="start">Brazil 75</text><path d="M175.0,744.0 L631.7,643.0 L1088.3,542.0 L1545.0,481.4" fill="none" stroke="#E57835" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="175.0" cy="744.0" r="7" fill="#E57835" stroke="white" stroke-width="2"></circle><circle cx="631.6666666666666" cy="643.0" r="7" fill="#E57835" stroke="white" stroke-width="2"></circle><circle cx="1088.3333333333333" cy="542.0" r="7" fill="#E57835" stroke="white" stroke-width="2"></circle><circle cx="1545.0" cy="481.40000000000003" r="7" fill="#E57835" stroke="white" stroke-width="2"></circle><text x="1558.0" y="488.40000000000003" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#E57835" text-anchor="start">Mexico 73</text><text x="175" y="941" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#586773" text-anchor="start">2000–2015: Brazil 68 → 75   |   Mexico 60 → 73</text><text x="95" y="968" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#586773" text-anchor="start">Service coverage is not a measure of legal entitlement, segmentation, or financial protection. 2021 data vintage.</text><text x="95" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#586773" text-anchor="start">Source: WHO and World Bank, Tracking Universal Health Coverage 2021, Annex 3.</text></svg>