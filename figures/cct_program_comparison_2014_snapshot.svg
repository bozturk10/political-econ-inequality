<text x="860" y="509" font-size="19" fill="#203040" font-weight="normal" text-anchor="start">Generally to the mother as named holder</text>
<text x="860" y="533" font-size="19" fill="#203040" font-weight="normal" text-anchor="start">through payment points or an account.</text>
