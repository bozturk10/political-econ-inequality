<circle cx="1482.6470588235295" cy="353.6255625" r="7" fill="#16838D" stroke="white" stroke-width="2"></circle><circle cx="1565.0" cy="351.96421875" r="7" fill="#16838D" stroke="white" stroke-width="2"></circle><text x="674.1176470588235" y="565" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#16838D" text-anchor="start">Brazil 2003: 181.5</text><text x="1579.0" y="359.96421875" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#16838D" text-anchor="start">Brazil 2014: 376.7</text><text x="95" y="900" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#586773" text-anchor="start">PPP conversion allows a common-unit level comparison; this is not the real-wage index.</text><text x="95" y="930" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#586773" text-anchor="start">Mexico: daily statutory rate converted to a month using 6 days × 4.33 weeks; Brazil: monthly national floor.</text><text x="95" y="978" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#586773" text-anchor="start">Source: ILOSTAT, EAR_INEE_CUR_NB_A (Monthly minimum wage by currency), two supplied CSV exports.</text><text x="95" y="1008" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#586773" text-anchor="start">The series is annual and has no sex breakdown. “Monthly” describes the wage amount, not observation frequency.</text></svg>